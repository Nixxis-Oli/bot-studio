<!doctype html>
<!-- data-palette selects one of the palettes authored in app.css. The inline
	 script restores the stored choice before first paint, so a reload does not
	 flash the default palette before the chosen one applies. -->
<html lang="en" data-palette="neutral">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Runs before first paint, so a reload does not flash the default palette
			// or the default sidebar width before the stored choice applies.
			try {
				const palette = localStorage.getItem('nixxis-palette');
				if (palette) document.documentElement.dataset.palette = palette;

				if (localStorage.getItem('nixxis-mode') === 'dark') {
					document.documentElement.classList.add('dark');
				}

				// The avatar's initials, so the toolbar paints the signed-in person
				// rather than the default account for one frame. Quoted here because
				// CSS content() needs a quoted string.
				const stored = localStorage.getItem('nixxis-user');
				if (stored) {
					const name = (JSON.parse(stored).name || '').trim();
					const initials = name
						.split(/\s+/)
						.slice(0, 2)
						.map((part) => part[0] || '')
						.join('')
						.toUpperCase();

					if (initials) {
						document.documentElement.style.setProperty(
							'--nixxis-initials',
							JSON.stringify(initials)
						);
					}
				}

				const width = parseInt(localStorage.getItem('sidebar_width') || '288', 10);
				if (width >= 200 && width <= 480) {
					document.documentElement.style.setProperty('--sidebar-width', width + 'px');
				}
			} catch {
				// Private mode or blocked storage: the defaults apply.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
